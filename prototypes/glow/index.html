<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>labui · glow — свет, не краска</title>
<style>
/*
  Прототип свечения (labui ADR-0002 §5, волна glow).

  ПРОВЕНАНС ЗНАЧЕНИЙ — контракт @labpics/colors-stub (glow-мост поезда,
  блок «Свечение — свет, не краска» в contract.css; решено движком:
  пример glow_mirror_derivation):
    контракт (зеркало теней): subtle=0.8563, base=2.3006, bloom=13.3251 |ΔJ'|
    прототип читает --lab-fx-glow-brand{,-core,-alpha} с фолбэками из того
    же вывода примера (страница работоспособна и без подключённого контракта).
  Оператор наложения — КОНТРАКТНЫЙ screen (не темнит по построению);
  радиусы — из spacing-шкалы токенов. Ступени subtle/bloom масштабируются
  от контрактной α Base отношением целей ΔJ' (0.8563/2.3006 и 13.3251/2.3006 —
  линейность screen по α в первом порядке; точные α — при живой эмиссии 0.6.0).
*/
:root {
  --bg: var(--lab-bg-primary, #101012);
  --bg-2: var(--lab-bg-secondary, #1c1c1e);
  --label: var(--lab-label-primary, #f2f2f7);
  --brand: var(--lab-fill-brand, #4a8fff);
  /* Контракт (glow-мост): фолбэки — тот же вывод примера движка. */
  --glow-core: var(--lab-fx-glow-brand-core, #b3c3ea); /* пересвет (J' к белому, M'/2) */
  --glow-halo: var(--lab-fx-glow-brand, #4a8fff);      /* halo = источник */
  --a-base: var(--lab-fx-glow-brand-alpha, 0.036);     /* контрактная ступень Base */
  /* subtle/bloom — масштаб от Base отношением целей ΔJ' (см. провенанс). */
  --a-subtle: calc(var(--a-base) * 0.3722);  /* 0.8563 / 2.3006 */
  --a-bloom: calc(var(--a-base) * 5.7920);   /* 13.3251 / 2.3006 */
  --r-core: var(--lab-space-2, 0.5rem);
  --r-halo: var(--lab-space-8, 2rem);
  --border: var(--lab-border-base, rgb(84 84 90 / 0.6));
}
[data-theme='light'] {
  --bg: var(--lab-bg-primary, #ffffff);
  --bg-2: var(--lab-bg-secondary, #f7f8fa);
  --label: var(--lab-label-primary, #101012);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 2rem;
  background: var(--bg); color: var(--label);
  font: 500 1rem/1.5 system-ui, sans-serif;
  grid-auto-rows: max-content; align-content: center;
}

/* ── Градиентная кнопка: стопы — движковые ступени, путь — oklch ── */
.btn {
  position: relative; isolation: isolate;
  min-height: var(--lab-size-control-h-m, 2.5rem);
  padding: 0 1.5rem; border: 0; border-radius: var(--lab-radius-control, 0.5rem);
  corner-shape: superellipse(var(--lab-radius-corner-k, 1.1));
  color: #fff; cursor: pointer;
  /* стопы: бренд и его пересвет-ядро — обе точки решены движком */
  background: linear-gradient(in oklch 135deg, var(--glow-halo), var(--glow-core));
}
/* halo: большой радиус, полная хрома источника, screen */
.btn::before {
  content: ''; position: absolute; inset: calc(-1 * var(--r-halo)); z-index: -1;
  border-radius: inherit; pointer-events: none;
  background: radial-gradient(closest-side, var(--glow-halo), transparent 70%);
  opacity: calc(var(--a-bloom) * var(--lit, 1) * 2);
  mix-blend-mode: screen; filter: blur(var(--r-halo));
  transition: opacity 160ms ease;
}
/* core: малый радиус, пересвеченное ядро */
.btn::after {
  content: ''; position: absolute; inset: calc(-1 * var(--r-core)); z-index: -1;
  border-radius: inherit; pointer-events: none;
  background: radial-gradient(closest-side, var(--glow-core), transparent 80%);
  opacity: calc(var(--a-base) * var(--lit, 1) * 4);
  mix-blend-mode: screen; filter: blur(var(--r-core));
  transition: opacity 160ms ease;
}
.btn:hover { --lit: 1.6; }
.btn:active { --lit: 0.8; }

/* ── Reveal: свет от курсора; light — только border, dark — fill+border ── */
.cards { display: flex; gap: 1rem; }
.card {
  position: relative; width: 12rem; height: 7rem; border-radius: var(--lab-radius-card, 1rem);
  background: var(--bg-2); border: 1px solid var(--border); overflow: hidden;
  display: grid; place-items: center;
}
.card::before { /* fill-reveal: только тёмная тема (среда свечения) */
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(10rem circle at var(--glow-x, 50%) var(--glow-y, 50%),
    var(--glow-halo), transparent 60%);
  mix-blend-mode: screen; transition: opacity 200ms ease;
}
[data-theme='dark'] .card:hover::before { opacity: var(--a-subtle); }
.card::after { /* border-reveal: обе темы — обводка ловит свет */
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  border-radius: inherit; padding: 1px;
  background: radial-gradient(8rem circle at var(--glow-x, 50%) var(--glow-y, 50%),
    var(--glow-core), transparent 55%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  mix-blend-mode: screen; transition: opacity 200ms ease;
}
.card:hover::after { opacity: calc(var(--a-base) * 8); }

@media (prefers-reduced-motion: reduce) {
  .card::before, .card::after {
    background: radial-gradient(closest-side at 50% 50%, var(--glow-halo), transparent 70%);
  }
}
.toggle { position: fixed; top: 1rem; right: 1rem; }
</style>
</head>
<body>
  <button class="btn">Градиентная кнопка со свечением</button>
  <div class="cards">
    <div class="card">Reveal A</div>
    <div class="card">Reveal B</div>
    <div class="card">Reveal C</div>
  </div>
  <button class="toggle" onclick="document.documentElement.dataset.theme =
    document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'">тема</button>
<script>
// Свет от курсора: JS пишет ТОЛЬКО две переменные, rAF-коалесинг
// (перф-паттерн liquid-glass) — ноль вычислений в кадре сверх записи.
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduced) {
  for (const card of document.querySelectorAll('.card')) {
    let raf = 0, ev = null;
    card.addEventListener('pointermove', (e) => {
      ev = e;
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const r = card.getBoundingClientRect();
        card.style.setProperty('--glow-x', `${(((ev.clientX - r.left) / r.width) * 100).toFixed(2)}%`);
        card.style.setProperty('--glow-y', `${(((ev.clientY - r.top) / r.height) * 100).toFixed(2)}%`);
      });
    });
  }
}
</script>
</body>
</html>
