<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>proto-a-lit — Button states matrix</title>
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body data-theme="dark">
    <main>
      <header>
        <h1>LabUI Button — Lit prototype</h1>
        <button id="theme-toggle" type="button" data-testid="theme-toggle">
          Toggle theme (now: <span data-testid="theme-name">dark</span>)
        </button>
      </header>

      <!-- Axis matrix: type x kind x size, plus icon + the reflected states.
           Rendered from JS so a wrong literal would fail typecheck. -->
      <section data-testid="matrix" id="matrix"></section>
    </main>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
