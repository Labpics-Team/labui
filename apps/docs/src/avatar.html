<!doctype html>
<html class="lab-scope" lang="ru" data-theme="light" data-material="ambient">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab UI — Avatar</title>
    <link rel="stylesheet" href="./primitives-demo.css" />
  </head>
  <body>
    <main>
      <h1 data-testid="avatar-title">Avatar</h1>
      <p>Десять цветов, округлённые инициалы и текстура. Lit и React используют одну геометрию и роли цвета.</p>
      <div class="row">
        <label for="theme-select">Тема</label>
        <select id="theme-select" data-testid="theme-select">
          <option value="light">Светлая</option><option value="dark">Тёмная</option>
        </select>
      </div>
      <section class="renderer" aria-label="Lit" data-testid="lit-renderer">
        <h2>Lit</h2><div id="lit-root"></div>
      </section>
      <section class="renderer" aria-label="React" data-testid="react-renderer">
        <h2>React</h2><div id="react-root"></div>
      </section>
    </main>
    <script type="module" src="./avatar-demo.tsx"></script>
  </body>
</html>
