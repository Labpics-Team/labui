<!doctype html>
<html class="lab-scope" lang="en" data-theme="light">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>LabUI Tooltip</title><link rel="stylesheet" href="./button-demo.css"/>
<style>.specimens{display:flex;flex-wrap:wrap;gap:32px;padding:64px}.author-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:80px 32px;width:100%;padding:64px 0}.clipped{width:96px;height:48px;overflow:hidden;transform:translateZ(0)}.local-theme{padding:16px;background:var(--lab-bg-primary)}dialog{overflow:hidden;transform:translateZ(0);padding:64px;border:0;border-radius:16px}</style>
</head><body><main>
<h1 data-testid="tooltip-title">Tooltip</h1><p>Supplementary text on hover and keyboard focus. Escape dismisses the hint without moving focus.</p>
<label>Theme <select data-testid="theme-select"><option value="light">Light</option><option value="dark">Dark</option></select></label>
<section class="renderer"><h2>Lit</h2><div class="specimens">
<lab-tooltip data-testid="lit-tt-bottom" content="Hello, my name is Tooltip"><lab-button>Bottom</lab-button></lab-tooltip>
<lab-tooltip data-testid="lit-tt-top" placement="top" content="Hello, my name is Tooltip">Top</lab-tooltip>
<lab-tooltip data-testid="lit-tt-disabled" disabled content="Never shows">Disabled</lab-tooltip>
<div class="clipped" data-testid="lit-clipped"><lab-tooltip placement="right" content="Hello, my name is Tooltip"><button>Clipped</button></lab-tooltip></div>
<div class="lab-scope local-theme" data-theme="light" data-testid="lit-local"><lab-tooltip content="Hello, my name is Tooltip"><lab-button>Local light</lab-button></lab-tooltip></div>
<div id="lit-grid" class="author-grid"></div>
</div></section>
<section class="renderer"><h2>React</h2><div id="react-root" class="specimens"></div></section>
<dialog id="dialog"><lab-tooltip content="Inside dialog" placement="top"><lab-button>Dialog trigger</lab-button></lab-tooltip></dialog>
</main><script type="module" src="./tooltip-demo.tsx"></script></body></html>
