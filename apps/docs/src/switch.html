<!doctype html>
<html class="lab-scope" lang="ru" data-theme="dark" data-material="ambient">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LabUI — Switch parity (Lit ↔ React)</title>
    <link rel="stylesheet" href="./button-demo.css" />
    <style>main { min-width: 0; } .specimens > span { max-width: 100%; } [data-testid="react-matrix"] { display: grid; grid-template-columns: repeat(3, max-content); gap: 1.5rem; } @media(max-width: 600px) { body:has([data-testid="switch-title"]) { padding: 1rem; } .renderer[data-testid] { padding: .5rem; } h1 { font-size: 1.5rem; overflow-wrap: anywhere; } [data-testid="react-matrix"] { grid-template-columns: 1fr; } }</style>
  </head>
  <body>
    <main>
      <h1 data-testid="switch-title">
        Switch parity — <code>&lt;lab-switch&gt;</code> (Lit) ↔ <code>&lt;Switch&gt;</code> (React)
      </h1>
      <p>Авторский Switch: нативный ввод, общая геометрия и движение Lit / React.</p>

      <div class="row">
        <label for="theme-select">Theme</label>
        <select id="theme-select" data-testid="theme-select">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>

      <!-- Lit renderer: the custom element, registered + styled in its shadow root. -->
      <section class="renderer" aria-label="Lit renderer" data-testid="lit-renderer">
        <h2>Lit</h2>
        <div class="specimens">
          <lab-switch data-testid="lit-accent-off" type="accent">Wi-Fi</lab-switch>
          <lab-switch data-testid="lit-accent-on" type="accent" checked>Wi-Fi</lab-switch>
          <lab-switch data-testid="lit-neutral-on" type="neutral" checked>Quiet</lab-switch>
          <lab-switch data-testid="lit-danger-on" type="danger" checked>Airplane</lab-switch>
          <lab-switch data-testid="lit-disabled" type="accent" disabled>Off</lab-switch>
          <!-- Icon-only specimen: no visible label, named only via aria-label. -->
          <lab-switch data-testid="lit-icon-only" type="accent" icon aria-label="Mute">

          </lab-switch>
        </div>
        <form data-testid="lit-form"><lab-switch name="alerts" value="yes" required default-checked>Уведомления</lab-switch><button type="reset">Сбросить</button><fieldset disabled><lab-switch name="disabled" checked>Недоступно</lab-switch></fieldset></form>
        <lab-switch data-testid="lit-controlled" controlled>Закреплённое значение</lab-switch>
        <lab-switch data-testid="lit-long" size="l" icon><span slot="label-start">Включить</span>Отправлять уведомления о завершении обработки фотографий автоматически</lab-switch>
      </section>

      <!-- React renderer: native, mounted from switch-demo.tsx into this node. -->
      <section class="renderer" aria-label="React renderer" data-testid="react-renderer">
        <h2>React</h2>
        <div id="react-root" class="specimens"></div>
      </section>
    </main>
    <script type="module" src="./switch-demo.tsx"></script>
  </body>
</html>
