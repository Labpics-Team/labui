<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Контекст SVG-фильтров материалов</title>
    <style>
      html, body { margin: 0; background: white; }
      body { --lab-bg-material-base-01: rgb(100 100 100); }
      main { display: flex; }
      .stage { position: relative; width: 320px; height: 240px; }
      .pattern {
        position: absolute;
        inset: 0;
        background: repeating-conic-gradient(rgb(230 65 55) 0% 25%, rgb(35 95 225) 0% 50%) 0 0 / 32px 32px;
      }
    </style>
  </head>
  <body>
    <main><div class="stage"><div class="pattern"></div></div><div class="stage"><div class="pattern"></div></div></main>
    <script type="module" src="./material-context.ts"></script>
  </body>
</html>
