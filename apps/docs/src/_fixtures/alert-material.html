<!doctype html>
<html data-theme="light" data-material="acrylic">
<head>
  <meta charset="utf-8">
  <title>Alert backdrop qualification</title>
  <style>
    body { margin: 0; font-family: Geist; }
    .backdrop { position: fixed; inset: 0; background: linear-gradient(90deg, #fff 0 var(--near-edge, 158px), #000 var(--near-edge, 158px) var(--far-edge, 420px), #fff var(--far-edge, 420px) 100%); }
    lab-alert { position: absolute; left: 64px; top: 32px; width: 450px; }
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <lab-alert heading="Saved" description="Changes are available" quantity="3" controlled></lab-alert>
  <script type="module" src="./alert-material.ts"></script>
</body>
</html>
