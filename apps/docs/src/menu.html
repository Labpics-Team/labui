<!doctype html>
<html class="lab-scope" lang="en" data-theme="light" data-material="acrylic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LabUI — Menu family</title>
    <link rel="stylesheet" href="./button-demo.css" />
    <style>
      .specimens { display:flex; flex-wrap:wrap; align-items:start; gap:2rem; padding:2rem 0; }
      .context-target { padding:2rem; border:1px dashed var(--lab-border-base); border-radius:1rem; }
      dialog { border:0; border-radius:1rem; padding:2rem; background:var(--lab-bg-primary); color:var(--lab-label-primary); }
      .clipped { transform:translateX(0); overflow:hidden; width:110px; height:48px; }
    </style>
  </head>
  <body><main>
    <h1>Menu family</h1>
    <p>Dropdown, context actions and menubar share nested commands, selection and authored materials.</p>
    <label for="theme-select">Theme</label><select id="theme-select"><option value="light">Light</option><option value="dark">Dark</option></select>
    <section><h2>Custom elements</h2><div class="specimens" id="lit-root"></div></section>
    <section><h2>React DOM</h2><div class="specimens" id="react-root"></div></section>
    <button id="outside" type="button">Outside control</button>
    <output id="event-log"></output>
  </main><script type="module" src="./menu-demo.tsx"></script></body>
</html>
