<!doctype html>
<html class="lab-scope" lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LabUI — Badge</title>
    <link rel="stylesheet" href="./primitives-demo.css" />
    <style>
      main { max-width: 920px; margin: auto; }
      .badge-comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
      .badge-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 8px; }
      .badge-cell { min-height: 20px; display: flex; justify-content: center; align-items: center; }
      .badge-head { font-size: 11px; color: var(--lab-label-secondary); text-align: center; }
      @media (max-width: 660px) { body { padding: 16px; } .badge-comparison { grid-template-columns: 1fr; } }
      @media (max-width: 420px) { .badge-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
  </head>
  <body><main>
    <h1>Метка</h1><p>Пятнадцать цветов, две заливки и общее недоступное состояние.</p>
    <div class="row"><label for="theme-select">Тема</label><select id="theme-select" data-testid="theme-select"><option value="light">Светлая</option><option value="dark">Тёмная</option></select></div>
    <lab-badge data-testid="default">Badge</lab-badge>
    <div class="badge-comparison">
      <section aria-label="Lit" data-testid="lit-renderer"><h2>Lit</h2><div class="badge-grid badge-head"><span>Fill</span><span>Off</span><span>Tinted</span><span>Off</span></div><div id="lit-grid" class="badge-grid"></div></section>
      <section aria-label="React" data-testid="react-renderer"><h2>React</h2><div class="badge-grid badge-head"><span>Fill</span><span>Off</span><span>Tinted</span><span>Off</span></div><div id="react-root" class="badge-grid"></div></section>
    </div>
  </main><script type="module" src="./badge-demo.tsx"></script></body>
</html>
