<!doctype html>
<html class="lab-scope" lang="ru" data-theme="light" data-material="acrylic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LabUI · Card</title>
    <link rel="stylesheet" href="./card.css" />
    <style>
      .card-samples { display: grid; gap: 32px; grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 400px)); }
      .card-samples > * { width: 400px; max-width: 100%; }
    </style>
  </head>
  <body>
    <main>
      <h1>Card</h1>
      <p>Изображение, описание и действия над одним предметом.</p>
      <div class="row">
        <label for="theme-select">Тема</label>
        <select id="theme-select" data-testid="theme-select">
          <option value="light">Светлая</option><option value="dark">Тёмная</option>
        </select>
      </div>
      <section aria-label="Lit">
        <h2>Lit</h2>
        <div class="card-samples">
          <lab-card data-testid="lit-source" image="./assets/card-source.png" heading="Title" description="Description"></lab-card>
          <lab-card data-testid="lit-elevated" heading="Рабочее пространство" description="Проекты и материалы команды">
            <div slot="footer"><lab-button size="s" data-testid="lit-interactive-control">Открыть пространство</lab-button></div>
          </lab-card>
          <lab-card data-testid="lit-outlined" variant="outlined" heading="Оформление" description="Тема и контраст"></lab-card>
          <lab-card data-testid="lit-filled" variant="filled" heading="Общее" description="Материалы команды"></lab-card>
        </div>
      </section>
      <section aria-label="React">
        <h2>React</h2>
        <div id="react-root" class="card-samples"></div>
      </section>
    </main>
    <script type="module" src="./card-demo.tsx"></script>
  </body>
</html>
