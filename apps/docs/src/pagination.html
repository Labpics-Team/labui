<!doctype html>
<html class="lab-scope" lang="en" data-theme="light" data-material="acrylic">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Pagination — Lab UI</title><link rel="stylesheet" href="./button-demo.css"/><style>body{padding:0}main{max-width:70rem;margin:auto;padding:min(2rem,5vw);overflow-wrap:anywhere}section{margin-block:2rem;padding:min(1.5rem,4vw);border-radius:1rem;background:var(--lab-bg-grouped-primary)}h3{margin-block:1.5rem .5rem}p{color:var(--lab-label-secondary)}#react-root,section{min-width:0}lab-pagination{margin-block:.75rem}[data-testid=react-ambient]{margin-block:1rem}</style></head>
<body><main><h1>Pagination</h1><p>Find a study, move between pages, and keep its place.</p><label>Appearance <select id="theme-select" data-testid="theme-select"><option value="light">Light</option><option value="dark">Dark</option></select></label>
<section><h2>HTML</h2><p id="lit-records"></p><lab-pagination data-testid="lit-pagination" count="60" page-size="3" page="3"></lab-pagination><h3>Controlled refusal</h3><lab-pagination data-testid="lit-pagination-refusal" count="200" page="3"></lab-pagination><h3>Compact</h3><p id="lit-slide">Frame 3</p><lab-pagination data-testid="lit-compact" count="8" page-size="1" default-page="3" variant="compact" progress="0.6"></lab-pagination><lab-pagination data-testid="lit-ambient" count="5" page-size="1" default-page="2" variant="compact" ambient progress="0.6"></lab-pagination></section>
<section><h2>React</h2><div id="react-root"></div><output id="refused"></output></section></main><script type="module" src="./pagination-demo.tsx"></script></body></html>
