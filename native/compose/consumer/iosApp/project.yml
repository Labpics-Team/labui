name: LabUIExample
options:
  bundleIdPrefix: pics.lab
  deploymentTarget:
    iOS: "15.0"
targets:
  LabUIExample:
    type: application
    platform: iOS
    sources: [App.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pics.lab.ui.example
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - framework: ../build/bin/iosSimulatorArm64/debugFramework/LabUIExample.framework
        embed: false
