vulnerabilities:
  - id: CVE-2026-112366
    purls:
      - pkg:npm/picomatch@2.3.2
      - pkg:npm/picomatch@4.0.4
      - pkg:npm/picomatch@4.0.7
    statement: >-
      На 18.11.2026 https://github.com/advisories/GHSA-fc5q-39xc-vjpf не содержит исправленной
      версии; npm latest 4.0.7 затронута. ReDoS требует передать атакующий glob как шаблон,
      например +(*a), а не просто строку для сопоставления. Все пути здесь заканчиваются
      devDependencies Changesets, Astro Container tests, Vite/Vitest, tsup или svelte-check.
      Шаблоны берутся из версионируемых workspace/config/import.meta.glob и конфигурации
      сборки; внешние HTTP-данные в шаблон не подставляются. Astro в этом workspace не
      обслуживает сервер: package scripts используют tsup и Vitest; Container tests задают
      локальные компоненты и literal glob. Продуктовые imports picomatch отсутствуют.
      Точный граф всех трёх версий проверяет scripts/ci/accepted-advisories-contract.mjs;
      новый путь или advisory требует отдельного разбора. Проверка исправленных уязвимостей
      продолжает сканировать без ignorefile и потребует обновления после выхода исправления.
  - id: CVE-2026-93687
    purls:
      - pkg:npm/braces@3.0.3
    statement: >-
      Приходит только через @changesets/cli — devDependency корня (путь держит
      scripts/ci/accepted-advisories-contract.mjs в CI), который раскрывает лишь glob-шаблоны из
      .changeset/config.json и pnpm-workspace.yaml этого репозитория; внешний ввод до braces не
      доходит.
  - id: CVE-2026-93748
    purls:
      - pkg:npm/http-cache-semantics@4.2.0
    statement: >-
      Приходит только через astro — devDependency @labpics/ui-astro (путь держит
      scripts/ci/accepted-advisories-contract.mjs в CI); astro вызывает пакет лишь в загрузчике
      удалённых изображений astro build, а здесь astro работает только в тестах через AstroContainer,
      без общего кэша и чужих запросов.
