name: Icons в Lab UI

on:
  push:
    branches: [main]
    paths: &consumer-paths
      - '.github/workflows/icons-consumer.yml'
      - '.github/scripts/browser-check.sh'
      - 'scripts/ci/*icons*'
      - 'scripts/ci/evidence-log*.mjs'
      - 'apps/docs/tests/icons-*'
      - 'apps/docs/tests/prepare-icons-inputs*.mjs'
      - 'packages/core/**'
      - 'packages/shadow/**'
      - 'packages/materials/**'
      - 'packages/tokens/**'
      - 'apps/docs/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths: *consumer-paths
  merge_group:

permissions:
  contents: read

concurrency:
  group: icons-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packed:
    name: Авторский символ в установленном Lab UI
    runs-on: [self-hosted, Linux, X64]
    # Тот же допуск collaborator-кода, что и у основного CI Lab UI.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    env:
      CI: 'true'
      UI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Проверить среду исполнения
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = self-hosted

      - name: Получить точный head Lab UI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.UI_SOURCE_COMMIT }}
          path: ui
          persist-credentials: false

      - name: Установить Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Прочитать закреплённый Icons SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(node ui/apps/docs/tests/prepare-icons-inputs.mjs --checkout-ref)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      # Публичный producer не требует credential приватного соседнего repo.
      - name: Получить точный источник Icons
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Labpics-Team/lab-icons
          ref: ${{ steps.source.outputs.sha }}
          path: icons
          persist-credentials: false

      - name: Проверить независимый oracle и владение browser lifecycle
        shell: bash
        run: node --test ui/apps/docs/tests/prepare-icons-inputs.test.mjs ui/apps/docs/tests/icons-public-entrypoints.test.mjs ui/apps/docs/tests/icons-state-continuity.test.mjs ui/scripts/ci/icons-browser-contract.test.mjs

      - name: Проверить установленный Lab UI в штатном browser runtime
        id: browser
        shell: bash
        run: bash ui/.github/scripts/browser-check.sh --icons-consumer "$GITHUB_WORKSPACE/icons"
