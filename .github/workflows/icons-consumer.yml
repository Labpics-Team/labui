name: Icons в Lab UI

on:
  push:
    branches: [main]
    paths: &consumer-paths
      - '.github/workflows/icons-consumer.yml'
      - '.github/scripts/browser-check.sh'
      - 'apps/docs/tests/**/icons-*'
      - 'apps/docs/tests/**/prepare-icons-inputs*.mjs'
      - 'apps/docs/tests/run-node-tests.mjs'
      - 'packages/core/**'
      - 'packages/shadow/**'
      - 'apps/docs/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths: *consumer-paths
  merge_group:

permissions:
  contents: read

concurrency:
  group: icons-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packed:
    name: Авторский символ в установленном Lab UI
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble@sha256:2f29369043d81d6d69a815ceb80760f55e85f5020371ad06a4d996f18503ad1c
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    env:
      CI: 'true'
      UI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Получить точный head Lab UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.UI_SOURCE_COMMIT }}
          path: ui
          persist-credentials: false

      - name: Прочитать закреплённый Icons SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(node ui/apps/docs/tests/prepare-icons-inputs.mjs --checkout-ref)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Получить точный источник Icons
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Labpics-Team/lab-icons
          ref: ${{ steps.source.outputs.sha }}
          path: icons
          persist-credentials: false

      - name: Проверить независимый oracle и владение browser lifecycle
        shell: bash
        run: node ui/apps/docs/tests/run-node-tests.mjs icons

      - name: Проверить установленный Lab UI в штатном browser runtime
        id: browser
        shell: bash
        run: bash ui/.github/scripts/browser-check.sh --icons-consumer "$GITHUB_WORKSPACE/icons"
