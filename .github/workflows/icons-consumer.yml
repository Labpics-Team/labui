name: Icons в Lab UI

on:
  push:
    branches: [main]
    paths: &consumer-paths
      - '.github/workflows/icons-consumer.yml'
      - '.github/scripts/browser-check.sh'
      - 'apps/docs/tests/icons-*'
      - 'apps/docs/tests/prepare-icons-inputs*.mjs'
      - 'packages/core/**'
      - 'packages/materials/**'
      - 'packages/tokens/**'
      - 'packages/shadow/**'
      - 'apps/docs/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths: *consumer-paths
  merge_group:

permissions:
  contents: read

concurrency:
  group: icons-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packed:
    name: Авторский символ в установленном Lab UI
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    env:
      CI: 'true'
      UI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Получить точный head Lab UI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.UI_SOURCE_COMMIT }}
          path: ui
          persist-credentials: false

      - name: Прочитать закреплённый Icons SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(node ui/apps/docs/tests/prepare-icons-inputs.mjs --checkout-ref)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Получить точный источник Icons
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Labpics-Team/lab-icons
          ref: ${{ steps.source.outputs.sha }}
          path: icons
          persist-credentials: false

      - name: Проверить независимый oracle и владение browser lifecycle
        shell: bash
        run: node --test ui/scripts/ci/evidence-log.test.mjs ui/apps/docs/tests/prepare-icons-inputs.test.mjs ui/apps/docs/tests/icons-public-provenance.test.mjs ui/apps/docs/tests/icons-public-terminal.test.mjs ui/apps/docs/tests/icons-public-entrypoints.test.mjs ui/apps/docs/tests/icons-state-continuity.test.mjs ui/apps/docs/tests/icons-git-diagnostics.test.mjs

      - name: Проверить установленный Lab UI в штатном browser runtime
        id: browser
        shell: bash
        run: bash ui/.github/scripts/browser-check.sh --icons-consumer "$GITHUB_WORKSPACE/icons"
