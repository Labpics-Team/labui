name: Workflow policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  policy:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Reject accidental PR-blocking of class-B workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          head = os.environ["HEAD_SHA"]
          base = os.environ.get("BASE_SHA") or ""
          api = "https://api.github.com"
          CLASS_B = re.compile(
              r"(nightly|probe|diagnostic|throwaway|billing|snapshot|agent-|fuzz|mutation|canary|zombie|e2e-full|release)",
              re.I,
          )

          def req(url, accept="application/vnd.github+json"):
              request = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": accept,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "labpics-ci-gate",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          def workflows(sha):
              if not sha or sha == "0" * 40:
                  return {}
              raw = req(f"{api}/repos/{repo}/contents/.github/workflows?ref={sha}")
              result = {}
              for item in json.loads(raw.decode()):
                  path = item.get("path") or ""
                  if not path.endswith((".yml", ".yaml")):
                      continue
                  body = req(
                      f"{api}/repos/{repo}/contents/{path}?ref={sha}",
                      "application/vnd.github.raw",
                  )
                  result[path] = body.decode("utf-8")
              if not result:
                  raise RuntimeError("workflow policy: no workflows read")
              return result

          def has_pr(text):
              section = re.split(r"(?m)^jobs:\s*$", text, maxsplit=1)[0]
              return bool(re.search(r"(?m)^\s+(pull_request|pull_request_target|merge_group)\s*:", section)) or bool(
                  re.search(r"(?m)^on:\s*(?:\[[^\]]*)?(pull_request|pull_request_target|merge_group)\b", section)
              )

          head_workflows = workflows(head)
          base_workflows = workflows(base)
          violations = []
          for path, text in head_workflows.items():
              name = path.rsplit("/", 1)[-1]
              if name == "ci-gate.yml" or not CLASS_B.search(name):
                  continue
              if not has_pr(text):
                  continue
              previous = base_workflows.get(path)
              if previous is not None and has_pr(previous):
                  continue
              violations.append(path)
          if violations:
              print("Class-B workflows newly gained PR/merge-group triggers; use schedule or workflow_dispatch:")
              print("\n".join(violations))
              sys.exit(1)
          print("workflow policy: no new class-B PR triggers")
          PY
