name: File Upload system picker qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_uiSource: ${{ github.workspace }}/native/compose

jobs:
  android:
    name: Android system document picker (API ${{ matrix.api-level }})
    strategy:
      fail-fast: false
      matrix:
        api-level: [33]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the consumer APK
        run: |
          bash native/compose/gradlew -p native/compose/consumer :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest \
            -PuiSource="$GITHUB_WORKSPACE/native/compose" \
            --console=plain
      - name: Enable hardware virtualization for the emulator
        run: sudo chmod a+rw /dev/kvm
      - name: Exercise the Android application
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.34.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 native/compose/scripts/verify-android-app.py --method filePickerImportsReadsCancelsAndRemovesARealDocument
      - name: Preserve emulator diagnostics after a failure
        if: failure()
        shell: bash
        run: |
          diagnostics=native/compose/consumer/androidApp/build/emulator-diagnostics
          mkdir -p "$diagnostics"
          sudo journalctl --since '-20 minutes' > "$diagnostics/host.txt" || true
          if [[ -d /tmp/android-runner ]]; then
            cp -R /tmp/android-runner "$diagnostics/crashdata"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-android-example-${{ matrix.api-level }}
          path: |
            native/compose/consumer/androidApp/build/outputs/apk/debug/*.apk
            native/compose/consumer/androidApp/build/outputs/androidTest-results
            native/compose/consumer/androidApp/build/reports/androidTests
            native/compose/consumer/androidApp/build/emulator-diagnostics
            native/compose/consumer/androidApp/build/application-evidence
          if-no-files-found: error
          retention-days: 7

  apple:
    name: iOS system document picker
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Link Apple consumer frameworks
        run: |
          bash native/compose/gradlew -p native/compose/consumer linkDebugFrameworkIosSimulatorArm64 \
            -PuiSource="$GITHUB_WORKSPACE/native/compose" \
            --console=plain
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and exercise the iOS application
        run: |
          python3 native/compose/consumer/iosApp/prepare.py
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test -project native/compose/consumer/iosApp/LabUIExample.xcodeproj \
            -scheme LabUIExample -only-testing:LabUIExampleUITests/FileUploadExperienceTests -destination "id=$simulator" \
            -derivedDataPath native/compose/consumer/build/xcode \
            -resultBundlePath native/compose/consumer/build/native-ui.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export Apple UI attachments
        if: always()
        run: |
          if [[ -d native/compose/consumer/build/native-ui.xcresult ]]; then
            xcrun xcresulttool export attachments --path native/compose/consumer/build/native-ui.xcresult \
              --output-path native/compose/consumer/build/ui-attachments
          fi
      - name: Preserve Apple application evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-apple-example
          path: |
            native/compose/consumer/build/native-ui.xcresult
            native/compose/consumer/build/ui-attachments
            native/compose/consumer/build/bin/*/debugFramework/*/Headers
            native/compose/consumer/build/xcode/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 7
