name: Colors Swift context qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_uiSource: ${{ github.workspace }}/native/compose

jobs:
  apple-context:
    name: Swift context failure and recovery
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Link the real Apple consumer framework
        run: bash native/compose/gradlew -p native/compose/consumer linkDebugFrameworkIosSimulatorArm64 --console=plain
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Exercise the exported suspend API from Swift
        run: |
          python3 native/compose/consumer/iosApp/prepare.py
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test -project native/compose/consumer/iosApp/LabUIExample.xcodeproj \
            -scheme LabUIExample -destination "id=$simulator" \
            -only-testing:LabUIExampleTests/ThemeContextTests \
            -derivedDataPath native/compose/consumer/build/xcode \
            -resultBundlePath native/compose/consumer/build/colors-context.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Save targeted test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: colors-swift-context
          path: |
            native/compose/consumer/build/colors-context.xcresult
            native/compose/consumer/build/bin/iosSimulatorArm64/debugFramework/LabUIExample.framework/Headers
          retention-days: 7
