name: Tags paste qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS editor clipboard and IME
    runs-on: macos-15
    timeout-minutes: 20
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true -Dskiko.renderApi=SOFTWARE
      SKIKO_RENDER_API: SOFTWARE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Exercise the real Compose editor
        run: bash native/compose/gradlew -p native/compose :desktopTest --tests pics.lab.ui.InputExtensionsRenderTest --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tags-paste-macos
          path: native/compose/build/test-results/desktopTest
          retention-days: 5

  android:
    name: Android clipboard (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Build actual consumer and instrumentation
        run: |
          bash native/compose/gradlew -p native/compose/consumer :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest \
            -PuiSource="$GITHUB_WORKSPACE/native/compose" --console=plain
      - name: Enable emulator virtualization
        run: sudo chmod a+rw /dev/kvm
      - name: Exercise native paste with ancestor receiver
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/qualify-tags-paste.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tags-paste-android-${{ matrix.api }}
          path: native/compose/consumer/androidApp/build/tags-paste
          retention-days: 5
