name: CI
'on':
  push:
    branches:
    - main
  pull_request: null
  merge_group: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: 'true'
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  BUSYBOX_IMAGE: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
jobs:
  sca:
    name: supply-chain · secrets · misconfig
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
    - name: Prepare workspace ownership
      shell: bash
      run: |
        set -euo pipefail
        export DOCKER_CONFIG="$(mktemp -d "${RUNNER_TEMP:?}/labui-docker.XXXXXX")"
        printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "${GITHUB_ENV:?}"
        mkdir -p "${GITHUB_WORKSPACE}"
        docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "${BUSYBOX_IMAGE}" \
          chown -R "$(id -u):$(id -g)" /workspace
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Cache Trivy DB
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: ${{ runner.temp }}/trivycache
        key: trivy-db-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          trivy-db-
    - name: Verify vulnerabilities, secrets and configuration
      shell: bash
      env:
        TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
        TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1
      run: bash .github/scripts/scan.sh
    - name: Upload Trivy report
      if: ${{ failure() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: trivy-report
        path: ${{ runner.temp }}/trivy-report.txt
        retention-days: 7
        if-no-files-found: ignore
  quality:
    name: lint · typecheck · build
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
    - name: Prepare workspace ownership
      shell: bash
      run: |
        set -euo pipefail
        export DOCKER_CONFIG="$(mktemp -d "${RUNNER_TEMP:?}/labui-docker.XXXXXX")"
        printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "${GITHUB_ENV:?}"
        mkdir -p "${GITHUB_WORKSPACE}"
        docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "${BUSYBOX_IMAGE}" \
          chown -R "$(id -u):$(id -g)" /workspace
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Setup pnpm
      uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      with:
        dest: ${{ runner.temp }}/setup-pnpm
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - name: Verify pnpm store isolation contract
      run: node scripts/ci/pnpm-store-contract.mjs
    - name: Install from isolated pnpm store
      shell: bash
      run: |
        set -euo pipefail
        store="$RUNNER_TEMP/pnpm-store-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
        rm -rf -- "$store"
        pnpm install --frozen-lockfile --ignore-scripts --store-dir "$store"
        pnpm rebuild @biomejs/biome esbuild --store-dir "$store"
    - name: Lint (Biome)
      run: pnpm lint
    - name: Format check (Biome)
      run: pnpm run format:check
    - name: Typecheck
      run: pnpm typecheck
    - name: Assert generated artifact is not stale (shadow)
      run: pnpm --filter @labpics/ui-shadow check-generated
    - name: Assert generated artifact is not stale (tokens)
      run: pnpm --filter @labpics/ui-tokens check-generated
    - name: Assert generated artifact is not stale (materials)
      run: pnpm --filter @labpics/ui-materials check-generated
    - name: Build
      run: pnpm build
    - name: Verify CI execution contracts
      shell: bash
      run: |
        node scripts/ci/artifact-retention-contract.mjs
        node --test ci/workflow-contract.test.mjs
        node --test scripts/ci/vitest-projects-contract.mjs
        node --test scripts/ci/scan-policy.test.mjs
    - name: Unit tests
      run: pnpm test
  e2e:
    name: playwright smoke (critical path)
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 25
    steps:
    - name: Prepare workspace ownership
      shell: bash
      run: |
        set -euo pipefail
        export DOCKER_CONFIG="$(mktemp -d "${RUNNER_TEMP:?}/labui-docker.XXXXXX")"
        printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "${GITHUB_ENV:?}"
        mkdir -p "${GITHUB_WORKSPACE}"
        docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "${BUSYBOX_IMAGE}" \
          chown -R "$(id -u):$(id -g)" /workspace
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Verify browser rendering and smoke tests
      id: browser
      shell: bash
      env:
        E2E_SMOKE: '1'
      run: bash .github/scripts/browser-check.sh
    - name: Upload FX-render артефакт (PNG для обзора владельцем)
      if: ${{ !cancelled() && steps.browser.outputs.fx_ready == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fx-render
        path: packages/colors/artifacts/fx-render/
        retention-days: 7
        if-no-files-found: ignore
    - name: Upload Playwright report
      if: ${{ failure() && steps.browser.outputs.report_ready == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: playwright-report
        path: apps/docs/playwright-report/
        retention-days: 7
        if-no-files-found: ignore
  ci:
    name: CI
    needs:
    - sca
    - quality
    - e2e
    if: ${{ always() }}
    runs-on: self-hosted
    timeout-minutes: 3
    permissions: {}
    steps:
    - name: Require complete verification
      shell: bash
      env:
        NEEDS_RESULTS: ${{ join(needs.*.result, ',') }}
      run: |
        set -euo pipefail
        if [[ ! "$NEEDS_RESULTS" =~ ^success(,success)*$ ]]; then
          printf 'Required verification did not succeed: %s\n' "$NEEDS_RESULTS" >&2
          exit 1
        fi
