name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Scan dependencies, configuration and secrets
        run: |
          set -euo pipefail
          unset "${!TRIVY_@}"
          version=0.74.0
          sum=2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          dir="$RUNNER_TEMP/trivy"
          mkdir -p "$dir"
          curl -fsSL --retry 3 --retry-all-errors -o "$dir/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v$version/trivy_${version}_Linux-64bit.tar.gz"
          echo "$sum  $dir/trivy.tgz" | sha256sum -c -
          tar -xzf "$dir/trivy.tgz" -C "$dir" trivy
          accepted=(--ignorefile /dev/null)
          [ -f .trivyignore.yaml ] && accepted=(--ignorefile .trivyignore.yaml)
          scan() { "$dir/trivy" fs --config /dev/null --cache-dir "$dir/cache" --exit-code 1 --no-progress "$@" .; }
          scan --scanners vuln,misconfig --severity UNKNOWN,HIGH,CRITICAL --include-dev-deps "${accepted[@]}"
          scan --scanners vuln --severity UNKNOWN,HIGH,CRITICAL --include-dev-deps --ignore-unfixed --ignorefile /dev/null
          printf 'disable-allow-rules:\n  - tests\n  - examples\n  - markdown\n' > "$dir/secret.yaml"
          secret_scan() { scan --scanners secret --secret-config "$dir/secret.yaml" --ignorefile /dev/null "$@"; }
          secret_scan
          source .github/scripts/secret-scan-contract.sh

  quality:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Keep browser verification independent of artifact storage
        run: node --test scripts/ci/artifact-storage-contract.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify accepted advisories stay on their reviewed paths
        run: node scripts/ci/accepted-advisories-contract.mjs

      - name: Check format, lint and imports (Biome)
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Assert generated artifact is not stale (shadow)
        run: pnpm --filter @labpics/ui-shadow check-generated

      - name: Assert generated artifact is not stale (tokens)
        run: pnpm --filter @labpics/ui-tokens check-generated

      - name: Assert generated artifact is not stale (materials)
        run: pnpm --filter @labpics/ui-materials check-generated

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  e2e:
    name: playwright smoke (critical path)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify browser rendering and smoke tests in pinned Playwright runtime
        id: browser
        shell: bash
        env:
          E2E_SMOKE: "1"
        run: bash .github/scripts/browser-check.sh

  ci:
    name: CI
    needs:
      - security
      - quality
      - e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require complete verification
        shell: bash
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          if [[ ! "$NEEDS_RESULTS" =~ ^success(,success)*$ ]]; then
            printf 'Required verification did not succeed: %s\n' "$NEEDS_RESULTS" >&2
            exit 1
          fi
