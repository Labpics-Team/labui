name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only by default. No job needs write here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Format check (Biome)
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  e2e:
    name: playwright smoke
    runs-on: ubuntu-latest
    # Engine suites (incl. the Class-D mutation bite-proof: ~11 full gate runs)
    # run here too — they need the Playwright browsers this job installs.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers (Chromium + WebKit)
        # WebKit added with materials-system: the glass material must read the
        # same across engines, so the glass smoke runs on Chromium AND WebKit.
        run: pnpm --filter @labpics/ui-docs exec playwright install --with-deps chromium webkit

      - name: Liquid-glass engine suites (browser Node tests)
        # Cache/scratch integration, pending-decode regression, mutation
        # bite-proof — they launch Chromium, so they live here, not in the
        # browserless quality job. The mutation harness freezes its pixel
        # reference on THIS machine (no committed baselines).
        run: pnpm --filter @labpics/ui-docs test:engine

      - name: Resolve hermetic VRT base (freeze-on-machine)
        # The visual gate freezes its reference from the BASE ref on this very
        # machine and diffs the PR head against it — committed screenshot
        # baselines are OS/font-coupled and are test artifacts that do not
        # belong in git. persist-credentials is off, so the extra ref is
        # fetched with the ephemeral job token explicitly.
        # ${{ }} никогда не инлайнится в тело скрипта (инъекционный класс из
        # GitHub Security Hardening) — все значения приходят через env.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}"
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 "$REMOTE" "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            echo "LG_GATE_BASE=origin/${BASE_REF}" >> "$GITHUB_ENV"
          else
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git fetch --no-tags --depth=1 "$REMOTE" "$BEFORE_SHA"; then
              echo "LG_GATE_BASE=$BEFORE_SHA" >> "$GITHUB_ENV"
            else
              git fetch --no-tags --deepen=1 "$REMOTE"
              echo "LG_GATE_BASE=HEAD~1" >> "$GITHUB_ENV"
            fi
          fi

      - name: Run smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/docs/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
