name: CI

# Тонкий caller: только триггеры, concurrency и права. Job graph, пины экшенов,
# env-пины образов и раскладка по раннерам закреплены в immutable ci-worker.yml на
# полном commit SHA — runner-group ACL допускает в одноразовую gVisor-ячейку DE-02
# только jobs из закреплённых worker'ов. Своих inputs у worker нет by design.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only by default. No job needs write here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: CI
    permissions:
      contents: read
    # Caller выбирает revision, который чекаутит worker, включая код PR. Сам код
    # считается недоверенным и исполняется только внутри одноразовой ячейки.
    uses: Labpics-Team/labui/.github/workflows/ci-worker.yml@971b295c17d15a4718185ace2fde646f851e95f1
