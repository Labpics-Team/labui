name: Native Space diagnosis

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-space-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.head_ref == 'diag/space-idle-ingress-st01a1a7a8'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout LabUI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout observed LabMotion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Labpics-Team/lab-motion
          ref: 763beccad852af791a0515b208550e0c8274c943
          path: .native-deps/motion
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.403"
      - name: Build existing Button consumer
        shell: pwsh
        run: |
          dotnet build examples/windows/Buttons.csproj --configuration Release -p:Platform=x64 `
            "-p:LabMotionProject=$env:GITHUB_WORKSPACE/.native-deps/motion/native/windows/LabMotion.WinUI.csproj" `
            --output "$env:RUNNER_TEMP/labui-space-diagnosis/app" --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Native diagnostic build failed.' }
      # Temporary failure capture. This does not replace or qualify the Native workflow.
      - name: Capture native spring boundaries and interior control
        shell: pwsh
        run: |
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source identity unavailable.' }
          $failed = $false
          foreach ($target in @('none', 'interior', 'opposite', 'same')) {
            $timings = if ($target -eq 'none') { @($false) } else { @($false, $true) }
            foreach ($late in $timings) {
              $arguments = @('-NoProfile', '-File', './native/windows/test/space-boundary-diagnostic.ps1',
                '-ApplicationDirectory', "$env:RUNNER_TEMP/labui-space-diagnosis/app",
                '-OutputPath', "$env:RUNNER_TEMP/labui-space-diagnosis/$target-$late.json",
                '-AnimationSettingsPath', "$env:GITHUB_WORKSPACE/.native-deps/motion/test/windows/animation-settings.cs",
                '-Source', $source, '-Retarget', $target)
              if ($late) { $arguments += '-Late' }
              pwsh @arguments
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
          }
          pwsh -NoProfile -File ./native/windows/test/space-boundary-diagnostic.ps1 `
            -ApplicationDirectory "$env:RUNNER_TEMP/labui-space-diagnosis/app" `
            -OutputPath "$env:RUNNER_TEMP/labui-space-diagnosis/setter.json" `
            -AnimationSettingsPath "$env:GITHUB_WORKSPACE/.native-deps/motion/test/windows/animation-settings.cs" `
            -Source $source -Retarget interior -SetTarget
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { throw 'Native boundary diagnosis failed; evidence is retained above.' }
