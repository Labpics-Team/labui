name: Material pixels with public Icons distribution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/material-pixels.yml'
      - 'docs/evidence/materials-20261117/probe-backdrop-support.mjs'
      - 'docs/evidence/materials-20261117/display-pixels.mjs'
      - 'docs/evidence/materials-20261117/display-pixels.test.mjs'
      - 'docs/evidence/materials-20261117/render-material-paints.mjs'
      - 'docs/evidence/materials-20261117/verify-scroll-paint.mjs'
      - 'docs/evidence/materials-20261117/verify-surface-shape.mjs'
      - 'packages/materials/src/**'
      - 'packages/materials/scripts/**'
      - 'packages/materials/package.json'
      - 'packages/materials/tsconfig*.json'
      - 'packages/materials/tsup.config.ts'
      - 'packages/core/src/**'
      - 'packages/core/scripts/**'
      - 'packages/core/package.json'
      - 'packages/core/tsconfig*.json'
      - 'packages/core/tsup.config.ts'
      - 'packages/tokens/src/**'
      - 'packages/tokens/scripts/**'
      - 'packages/fonts/fonts/**'
      - 'packages/fonts/fonts.css'
      - 'apps/docs/src/foundation.css'
      - 'apps/docs/src/_fixtures/alert-material.*'
      - 'apps/docs/tests/alert-material.mjs'
      - 'packages/colors/contract.css'
      - 'packages/colors/test/fx-render/fx-render.mjs'
      - 'packages/colors/package.json'
      - 'apps/docs/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'tsup.config.base.ts'

permissions:
  contents: read

concurrency:
  group: material-pixels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixels:
    name: backdrop pixels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MATERIAL_CONTOUR: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Select Alert measurement directory
        run: printf 'MATERIAL_OUTPUT=%s/labui-alert-material\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install browser tools with the published Icons 0.4 git distribution
        # Diagnostic branch only: the product branch still consumes npm 0.4.
        # All 1507 published runtime files match the tested npm archive exactly;
        # its package.json additionally retains repository scripts/packageManager.
        run: |
          curl --fail --location --max-time 180 'https://codeload.github.com/Labpics-Team/lab-icons/tar.gz/983c72ad2958a8a9f2e4fd09a70d2ec38d617903' -o "$RUNNER_TEMP/icons-dist.tgz"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          const archive = `${process.env.RUNNER_TEMP}/icons-dist.tgz`;
          assert.equal(createHash('sha256').update(readFileSync(archive)).digest('hex'), '9f9adfa6438519281119e8eb742f2ec785bf44910d0881c69b9e0ae223ce9bcd');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          pkg.pnpm.overrides['@labpics/icons'] = `file:${archive}`;
          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --no-frozen-lockfile
      - name: Verify display frame selection
        run: node --test docs/evidence/materials-20261117/display-pixels.test.mjs
      - name: Install browser runtimes
        run: pnpm --filter @labpics/ui-docs exec playwright install --with-deps chromium firefox webkit
      - name: Build production material renderer and Alert dependencies
        run: pnpm --filter @labpics/ui-core... build
      - name: Measure production paint rendering
        run: node docs/evidence/materials-20261117/render-material-paints.mjs
      - name: Measure backdrop rendering and neutral paint composition
        run: node docs/evidence/materials-20261117/probe-backdrop-support.mjs
      - name: Measure actual Alert backdrop and regression control
        run: node apps/docs/tests/alert-material.mjs
      - name: Measure real Linux compositor
        if: runner.os == 'Linux'
        env:
          MATERIAL_CAPTURE: display
        run: |
          mkdir -p "$RUNNER_TEMP/labui-display"
          XWD_FILE="$RUNNER_TEMP/labui-display/Xvfb_screen0" xvfb-run -a -s "-screen 0 1280x720x24 -fbdir $RUNNER_TEMP/labui-display" node docs/evidence/materials-20261117/probe-backdrop-support.mjs
          XWD_FILE="$RUNNER_TEMP/labui-display/Xvfb_screen0" xvfb-run -a -s "-screen 0 1280x720x24 -fbdir $RUNNER_TEMP/labui-display" node docs/evidence/materials-20261117/render-material-paints.mjs
          XWD_FILE="$RUNNER_TEMP/labui-display/Xvfb_screen0" xvfb-run -a -s "-screen 0 1280x720x24 -fbdir $RUNNER_TEMP/labui-display" node apps/docs/tests/alert-material.mjs
      - name: Measure real macOS compositor
        if: runner.os == 'macOS'
        env:
          MATERIAL_CAPTURE: display
        run: |
          node docs/evidence/materials-20261117/probe-backdrop-support.mjs
          node docs/evidence/materials-20261117/render-material-paints.mjs
          node apps/docs/tests/alert-material.mjs
      - name: Preserve Alert compositor measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alert-material-${{ matrix.os }}
          path: ${{ env.MATERIAL_OUTPUT }}
          if-no-files-found: ignore
          retention-days: 7
