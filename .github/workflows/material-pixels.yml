name: Material pixels

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/material-pixels.yml'
      - 'docs/evidence/materials-20261117/probe-backdrop-support.mjs'
      - 'docs/evidence/materials-20261117/display-pixels.mjs'
      - 'docs/evidence/materials-20261117/display-pixels.test.mjs'
      - 'docs/evidence/materials-20261117/render-material-paints.mjs'
      - 'docs/evidence/materials-20261117/verify-scroll-paint.mjs'
      - 'docs/evidence/materials-20261117/verify-surface-shape.mjs'
      - 'packages/materials/src/**'
      - 'packages/materials/scripts/**'
      - 'packages/materials/package.json'
      - 'packages/materials/tsconfig*.json'
      - 'packages/materials/tsup.config.ts'
      - 'packages/colors/contract.css'
      - 'packages/colors/test/fx-render/fx-render.mjs'
      - 'packages/colors/package.json'
      - 'apps/docs/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'tsup.config.base.ts'

permissions:
  contents: read

concurrency:
  group: material-pixels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixels:
    name: backdrop pixels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MATERIAL_CONTOUR: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pinned browser tools
        run: pnpm install --frozen-lockfile
      - name: Verify display frame selection
        run: node --test docs/evidence/materials-20261117/display-pixels.test.mjs
      - name: Install browser runtimes
        run: pnpm --filter @labpics/ui-docs exec playwright install --with-deps chromium firefox webkit
      - name: Build production material renderer
        run: pnpm --filter @labpics/ui-materials build
      - name: Measure production paint rendering
        run: node docs/evidence/materials-20261117/render-material-paints.mjs
      - name: Measure backdrop rendering and neutral paint composition
        run: node docs/evidence/materials-20261117/probe-backdrop-support.mjs
      - name: Measure real Linux compositor
        if: runner.os == 'Linux'
        env:
          MATERIAL_CAPTURE: display
        run: |
          mkdir -p "$RUNNER_TEMP/labui-display"
          XWD_FILE="$RUNNER_TEMP/labui-display/Xvfb_screen0" xvfb-run -a -s "-screen 0 1280x720x24 -fbdir $RUNNER_TEMP/labui-display" node docs/evidence/materials-20261117/probe-backdrop-support.mjs
          XWD_FILE="$RUNNER_TEMP/labui-display/Xvfb_screen0" xvfb-run -a -s "-screen 0 1280x720x24 -fbdir $RUNNER_TEMP/labui-display" node docs/evidence/materials-20261117/render-material-paints.mjs
      - name: Measure real macOS compositor
        if: runner.os == 'macOS'
        env:
          MATERIAL_CAPTURE: display
        run: |
          node docs/evidence/materials-20261117/probe-backdrop-support.mjs
          node docs/evidence/materials-20261117/render-material-paints.mjs
