name: E2E Full

# Тонкий caller: только расписание, кнопка, concurrency и права. Job graph и пины
# закреплены в immutable e2e-full-worker.yml на полном commit SHA — runner-group
# ACL допускает в одноразовую gVisor-ячейку DE-02 только jobs из закреплённых
# worker'ов. Своих inputs у worker нет by design.

on:
  schedule:
    # 03:00 UTC = 06:00 MSK — вне пиковой нагрузки.
    - cron: "0 3 * * *"
  workflow_dispatch:

# Least privilege: read-only, как в ci.yml. Ни один шаг не пишет в репозиторий.
permissions:
  contents: read

# Отдельная от ci.yml группа: ночной прогон не конфликтует с PR-ным CI и с ручным
# dispatch. Долгий полный прогон не отменяем на лету (cancel-in-progress: false).
concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker:
    name: E2E Full
    permissions:
      contents: read
    uses: Labpics-Team/labui/.github/workflows/e2e-full-worker.yml@971b295c17d15a4718185ace2fde646f851e95f1
