name: E2E Full
'on':
  schedule:
  - cron: 0 3 * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  e2e-full:
    name: playwright full (chromium + webkit)
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
    - name: Prepare Docker config
      shell: bash
      run: |
        set -euo pipefail
        docker_config="$(mktemp -d "${RUNNER_TEMP:?}/labui-docker.XXXXXX")"
        printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "${GITHUB_ENV:?}"
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Verify browser rendering and full suite
      id: browser
      shell: bash
      env:
        E2E_SMOKE: '0'
      run: bash .github/scripts/browser-check.sh
    - name: Upload Playwright report
      if: ${{ failure() && steps.browser.outputs.report_ready == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: playwright-report-full
        path: apps/docs/playwright-report/
        retention-days: 7
        if-no-files-found: ignore
