name: E2E Full
'on':
  schedule:
  - cron: 0 3 * * *
  workflow_dispatch: null
  pull_request: null
permissions:
  contents: read
concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: false
env:
  BUSYBOX_IMAGE: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
jobs:
  e2e-full:
    name: playwright full (chromium + webkit)
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
    - name: Prepare workspace ownership
      shell: bash
      run: |
        set -euo pipefail
        export DOCKER_CONFIG="$(mktemp -d "${RUNNER_TEMP:?}/labui-docker.XXXXXX")"
        printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "${GITHUB_ENV:?}"
        mkdir -p "${GITHUB_WORKSPACE}"
        docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "${BUSYBOX_IMAGE}" \
          chown -R "$(id -u):$(id -g)" /workspace
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Verify browser rendering and full suite
      id: browser
      shell: bash
      env:
        E2E_SMOKE: '0'
      run: bash .github/scripts/browser-check.sh
    - name: Upload Playwright report
      if: ${{ !cancelled() && steps.browser.outputs.report_ready == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: playwright-report-full
        path: apps/docs/playwright-report/
        retention-days: 7
        if-no-files-found: ignore
