name: E2E Full

# Полный e2e-набор (ВСЕ спеки × chromium+webkit, ~319 × 2 ≈ 638 тестов) — ДОРОГОЙ
# и склонный к голоданию/флаку на нагруженном self-hosted пуле, поэтому НЕ висит на
# каждом PR. Здесь он гоняется по расписанию (ночью) и по кнопке (workflow_dispatch).
# Полное покрытие НЕ потеряно относительно прежнего CI — оно просто перенесено сюда;
# per-PR остаётся быстрый smoke-подмножество критического пути (см. ci.yml, job e2e).
on:
  schedule:
    # 03:00 UTC = 06:00 MSK — вне пиковой нагрузки раннеров.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      artifact_access_probe:
        description: Проверить доступ к public artifact без запуска E2E
        type: boolean
        required: false
        default: false

# Least privilege: read-only, как в ci.yml. Ни один шаг не пишет в репозиторий.
permissions:
  contents: read

# Отдельная от ci.yml группа: ночной прогон не конфликтует с PR-ным CI и с ручным
# dispatch. Долгий полный прогон не отменяем на лету (cancel-in-progress: false).
concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: false

env:
  # ROOT-контейнер busybox для очистки воркспейса и возврата владения на self-hosted
  # раннерах — тот же паттерн и тот же пин (тег + дайджест), что в ci.yml. Бампить
  # ОБА поля вместе и синхронно с ci.yml. Дайджест — OCI-индекс busybox:1.36 (multi-arch).
  BUSYBOX_IMAGE: "busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
  # Анонимный job-локальный docker-конфиг: credsStore=desktop из ~/.docker ломает
  # пуллы, когда docker-credential-desktop.exe вне PATH systemd-сервиса (после
  # рестарта дистро). Синхронно с ci.yml.
  DOCKER_CONFIG: "/tmp/labui-ci-docker-anon"

jobs:
  artifact-access-probe:
    name: public artifact access only
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_access_probe }}
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      actions: read
    env:
      PROBE_ARTIFACT_ID: "13466839275"
      PROBE_RUN_ID: "42140643760"
      PROBE_SOURCE_SHA: "fa8409d6e563ab560ccd037b41f5e8b6a7775539"
      PROBE_REPOSITORY_ID: "1221255339"
    steps:
      - name: Select this probe directory
        shell: bash
        run: |
          printf 'PROBE_DIR=%s/public-artifact-probe-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify public producer artifact metadata
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch(
            `${process.env.GITHUB_API_URL}/repos/Labpics-Team/lab-colors/actions/artifacts/${process.env.PROBE_ARTIFACT_ID}`,
            {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_READ_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            },
          );
          assert.equal(response.status, 200, `Artifact metadata HTTP ${response.status}`);
          const artifact = await response.json();
          assert.equal(String(artifact.id), process.env.PROBE_ARTIFACT_ID);
          assert.equal(artifact.expired, false);
          assert.equal(String(artifact.workflow_run.id), process.env.PROBE_RUN_ID);
          assert.equal(artifact.workflow_run.head_sha, process.env.PROBE_SOURCE_SHA);
          assert.equal(String(artifact.workflow_run.repository_id), process.env.PROBE_REPOSITORY_ID);
          assert.equal(String(artifact.workflow_run.head_repository_id), process.env.PROBE_REPOSITORY_ID);
          console.log(`Verified public artifact metadata: ${artifact.id}`);
          NODE
      - name: Download public producer artifact with this job token
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: Labpics-Team/lab-colors
          run-id: ${{ env.PROBE_RUN_ID }}
          artifact-ids: ${{ env.PROBE_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          path: ${{ env.PROBE_DIR }}
          skip-decompress: true
      - name: Report access-only result
        shell: bash
        run: |
          printf '%s\n' 'Public artifact downloaded with the LabUI job token. Access probe only; package and runtime were not qualified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove probe files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROBE_DIR:-}" ]; then exit 0; fi
          case "$PROBE_DIR" in
            "$RUNNER_TEMP"/public-artifact-probe-*) ;;
            *) exit 1 ;;
          esac
          rm -rf -- "$PROBE_DIR"

  e2e-full:
    name: playwright full (chromium + webkit)
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.artifact_access_probe }}
    runs-on: self-hosted
    # Полный набор длиннее smoke; на нагруженном пуле даём запас, но не бесконечный.
    timeout-minutes: 40
    steps:
      # Тот же root-контейнерный clean, что и во всех job'ах ci.yml: self-hosted
      # раннеры делят _work, docker-as-root шаги (Playwright) оставляют root-owned
      # файлы, а daniel (uid 1000) без passwordless sudo их не удалит обычным `rm`.
      # ROOT-контейнер busybox сносит содержимое воркспейса независимо от истории
      # раннера и возвращает владение каталогом раннеру (`id -u`) для checkout'а.
      - name: Чистый воркспейс (self-hosted)
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}" "${DOCKER_CONFIG}"
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "${BUSYBOX_IMAGE}" \
            sh -c 'rm -rf /workspace/* /workspace/.[!.]* /workspace/..?* 2>/dev/null || true; chown "$1:$2" /workspace' sh "$(id -u)" "$(id -g)"
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run FULL e2e suite in pinned Playwright runtime
        id: browser
        shell: bash
        env:
          E2E_SMOKE: "0"
        run: bash .github/scripts/browser-check.sh

      - name: Вернуть владение воркспейса раннеру (self-hosted cleanup)
        # Это дополнительное восстановление: сбой виден, следующая первичная очистка обязательна.
        # Тот же defence-in-depth chown-back, что и в e2e-job ci.yml: возвращаем
        # владение раннеру (`id -u`) через ROOT-контейнер busybox, чтобы clean-шаг
        # следующего job'а на этом раннере не спотыкался о root-owned файлы.
        if: ${{ always() }}
        shell: bash
        run: |
          if ! docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "${BUSYBOX_IMAGE}" \
            chown -R "$(id -u):$(id -g)" /workspace; then
            printf '::warning::Workspace ownership restore failed; mandatory cleanup runs before the next checkout.\n' >&2
          fi
