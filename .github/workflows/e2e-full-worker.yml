name: E2E Full worker

# Полный e2e-набор (ВСЕ спеки × chromium+webkit, ~319 × 2 ≈ 638 тестов) — ДОРОГОЙ,
# поэтому НЕ висит на каждом PR: расписание и кнопка живут в тонком caller'е
# (e2e-full.yml). Полное покрытие НЕ потеряно относительно прежнего CI — оно просто
# перенесено сюда; per-PR остаётся быстрый smoke критического пути (ci-worker.yml,
# job e2e).
#
# Неизменяемый worker для одноразовой gVisor-ячейки DE-02: тот же trust root, что
# у ci-worker.yml — caller закрепляет этот файл полным commit SHA и не может
# изменить ни job graph, ни пины. Своих inputs у worker нет by design.

on:
  workflow_call:

# Least privilege: read-only, как в ci-worker.yml. Ни один шаг не пишет в репозиторий.
permissions:
  contents: read

env:
  # ROOT-контейнер busybox для очистки воркспейса и возврата владения — тот же
  # паттерн и тот же пин (тег + дайджест), что в ci-worker.yml. Бампить ОБА поля
  # вместе и синхронно с ci-worker.yml. Дайджест — OCI-индекс busybox:1.36 (multi-arch).
  BUSYBOX_IMAGE: "busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
  # Анонимный job-локальный docker-конфиг: унаследованный credsStore зовёт хелпер,
  # которого в слоте нет, и ломает пуллы. Синхронно с ci-worker.yml.
  DOCKER_CONFIG: "/tmp/labui-ci-docker-anon"

jobs:
  e2e-full:
    name: playwright full (chromium + webkit)
    runs-on: { group: labpics-ci-sandbox, labels: [labpics-ci-gvisor-v1] }
    # Полный набор длиннее smoke; на нагруженном пуле даём запас, но не бесконечный.
    timeout-minutes: 40
    steps:
      # Тот же root-контейнерный clean, что и во всех job'ах ci-worker.yml:
      # docker-as-root шаги (Playwright) оставляют root-owned файлы, которые
      # непривилегированный пользователь job'а без passwordless sudo не удалит
      # обычным `rm`. ROOT-контейнер busybox сносит содержимое воркспейса
      # независимо от состояния слота и возвращает владение фактическому uid/gid процесса раннера.
      - name: Чистый воркспейс (root-контейнер busybox)
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}" "${DOCKER_CONFIG}"
          runner_uid="$(id -u)"; runner_gid="$(id -g)"
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "${BUSYBOX_IMAGE}" \
            sh -c 'rm -rf /workspace/* /workspace/.[!.]* /workspace/..?* 2>/dev/null || true; chown "$1:$2" /workspace' sh "${runner_uid}" "${runner_gid}"
          test -w "${GITHUB_WORKSPACE}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # per-job dest: runner.temp изолирован и одноразов — установка pnpm не
          # зависит от домашнего каталога образа
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Одноразовый слот: GitHub-кэш не нужен. У setup-node вход `cache` — это
          # перечисление пакетных менеджеров, поэтому кэш выключается ОТСУТСТВИЕМ
          # `cache` плюс явным гашением автокэша npm (`cache: false` там падает).
          package-manager-cache: false
          # GitHub-cache-сервис к тому же флачит/виснет на сетевом эгрессе.
          # Синхронно с ci-worker.yml.
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers (Chromium + WebKit)
        # Как в ci-worker.yml: только браузеры в ~/.cache/ms-playwright (в
        # одноразовом слоте это каталог job'а). Системные библиотеки запечены в
        # образе ячейки, поэтому --with-deps НЕ нужен.
        run: pnpm --filter @labpics/ui-docs exec playwright install chromium webkit

      - name: Run FULL e2e suite (all specs × chromium + webkit)
        # E2E_SMOKE НЕ выставлен → playwright.config.ts оставляет дефолтный
        # testMatch и гоняет ВЕСЬ набор. Это и есть полное покрытие.
        run: |
          # PW_PORT выводится из имени раннера — правило порт-на-раннер сохранено
          # дословно и в ячейке корректно (см. ci-worker.yml).
          n="${RUNNER_NAME##*-}"; case "$n" in (*[!0-9]*|'') n=0;; esac
          export PW_PORT=$((43200 + n))
          pkill -f -- "--port ${PW_PORT}" 2>/dev/null || true
          pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-full
          path: apps/docs/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Вернуть владение воркспейса (cleanup после root-контейнеров)
        # Тот же defence-in-depth chown-back, что и в e2e-job ci-worker.yml:
        # возвращаем владение фактическому uid/gid процесса раннера через ROOT-контейнер,
        # чтобы последующие шаги не спотыкались о root-owned файлы.
        if: ${{ always() }}
        shell: bash
        run: |
          runner_uid="$(id -u)"; runner_gid="$(id -g)"
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "${BUSYBOX_IMAGE}" \
            chown -R "${runner_uid}:${runner_gid}" /workspace
          test -w "${GITHUB_WORKSPACE}"
