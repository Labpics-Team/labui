name: Prepare native Icons source
description: Prepare the accepted Icons generator until public Maven qualification
inputs:
  source:
    description: Exact accepted Icons commit
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Labpics-Team/lab-icons
        ref: ${{ inputs.source }}
        path: .dependencies/icons
        persist-credentials: false
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        package_json_file: .dependencies/icons/package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '24'
    - shell: bash
      working-directory: .dependencies/icons
      run: pnpm install --frozen-lockfile
