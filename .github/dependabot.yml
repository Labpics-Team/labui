# Standard dependencies only; vendored sources and compatibility fixtures keep their product contracts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    # Browser binaries and visual baselines are paired with the CI image.
    # Version-only exclusions preserve separate security-update eligibility.
    ignore:
      - dependency-name: '@playwright/test'
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'playwright'
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'playwright-core'
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
